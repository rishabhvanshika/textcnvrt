<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Rewriter</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .tone-btn {
            @apply px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200 cursor-pointer;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        
        @media (max-width: 640px) {
            .container {
                padding-left: 1rem;
                padding-right: 1rem;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-700">AI Content Rewriter</h1>
            <p class="text-gray-600 mt-2">Transform your text into different tones with AI</p>
        </header>

        <div class="bg-white rounded-lg shadow-md p-6 max-w-4xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="originalText" class="block text-sm font-medium text-gray-700 mb-2">Original Text</label>
                    <textarea id="originalText" rows="10" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="Paste your text here..."></textarea>
                </div>
                <div>
                    <label for="rewrittenText" class="block text-sm font-medium text-gray-700 mb-2">Rewritten Text</label>
                    <textarea id="rewrittenText" rows="10" readonly class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-gray-50"></textarea>
                </div>
            </div>

            <div class="mt-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Tone</label>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2">
                    <button onclick="rewriteText('professional')" class="tone-btn bg-blue-100 text-blue-800 hover:bg-blue-200">Professional</button>
                    <button onclick="rewriteText('casual')" class="tone-btn bg-green-100 text-green-800 hover:bg-green-200">Casual</button>
                    <button onclick="rewriteText('friendly')" class="tone-btn bg-purple-100 text-purple-800 hover:bg-purple-200">Friendly</button>
                    <button onclick="rewriteText('persuasive')" class="tone-btn bg-yellow-100 text-yellow-800 hover:bg-yellow-200">Persuasive</button>
                    <button onclick="rewriteText('formal')" class="tone-btn bg-gray-100 text-gray-800 hover:bg-gray-200">Formal</button>
                </div>
            </div>

            <div class="mt-6 flex justify-between items-center">
                <div>
                    <button onclick="copyToClipboard()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300">Copy</button>
                    <button onclick="clearText()" class="ml-2 px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300">Clear</button>
                </div>
                <div id="loadingSpinner" class="hidden flex items-center">
                    <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-indigo-600"></div>
                    <span class="ml-2 text-gray-600">Rewriting...</span>
                </div>
            </div>
        </div>

        <footer class="mt-12 text-center text-gray-500 text-sm">
            <p>Powered by DeepSeek AI</p>
        </footer>
    </div>

    <script>
        // Client-side JavaScript
        async function rewriteText(tone) {
            const originalText = document.getElementById('originalText').value.trim();
            if (!originalText) {
                alert('Please enter some text to rewrite');
                return;
            }

            const loadingSpinner = document.getElementById('loadingSpinner');
            const rewrittenText = document.getElementById('rewrittenText');
            
            loadingSpinner.classList.remove('hidden');
            rewrittenText.value = '';

            try {
                // In a real implementation, this would call your Flask backend
                // For this demo, we'll simulate the API response
                const simulatedResponse = await simulateDeepSeekAPI(originalText, tone);
                rewrittenText.value = simulatedResponse;
                
                // In a real app, you would use:
                /*
                const response = await fetch('/rewrite', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: originalText, tone: tone })
                });
                const data = await response.json();
                rewrittenText.value = data.rewritten_text;
                */
            } catch (error) {
                console.error('Error:', error);
                rewrittenText.value = 'Error: Could not rewrite the text. Please try again.';
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        }

        // Simulate the DeepSeek API response for demo purposes
        function simulateDeepSeekAPI(text, tone) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const tones = {
                        'professional': `After careful consideration of the input provided, I have reconstructed the content with a professional tone that would be appropriate for business communications and formal correspondence. The revised version maintains the original meaning while enhancing clarity and professionalism.\n\n"${text.toUpperCase()}"`,
                        'casual': `Hey there! Here's a more relaxed, conversational version of what you wrote. It keeps the same meaning but sounds more natural in everyday talk.\n\n"${text}"`,
                        'friendly': `I'd love to help! Here's a warm, friendly version of your text that keeps things positive and approachable while preserving your original message.\n\n"${text}"`,
                        'persuasive': `This compelling version of your text is designed to convince and motivate readers to take action. It maintains your core message while making it more impactful.\n\n"${text} - AND THIS IS WHY IT MATTERS!"`,
                        'formal': `In accordance with academic and formal writing standards, I have meticulously reconstructed the provided text to adhere to the highest levels of linguistic precision and decorum.\n\n"${text}"`
                    };
                    resolve(tones[tone] || `Here's your rewritten text:\n\n"${text}"`);
                }, 1500);
            });
        }

        function copyToClipboard() {
            const rewrittenText = document.getElementById('rewrittenText');
            rewrittenText.select();
            document.execCommand('copy');
            
            const copyButton = document.querySelector('button[onclick="copyToClipboard()"]');
            const originalText = copyButton.textContent;
            copyButton.textContent = 'Copied!';
            setTimeout(() => {
                copyButton.textContent = originalText;
            }, 2000);
        }

        function clearText() {
            document.getElementById('originalText').value = '';
            document.getElementById('rewrittenText').value = '';
        }
    </script>
